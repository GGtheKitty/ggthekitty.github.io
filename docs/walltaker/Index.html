<!DOCTYPE html>
<html>
  <head lang="de">
    <meta charset="UTF-8" />
    <title>Walltaker for Wallpaper Engine</title>
    <script>
      const hostedWallpaperUrl =
        'https://ggthekitty.github.io/walltaker/Index.html?v=2';

      if (window.location.protocol === 'file:') {
        // Wallpaper Engine applies its properties after the local document has
        // loaded. Wait for that callback so they survive the HTTPS handoff.
        window.redirectToHostedWallpaper = (properties) => {
          const values = Object.fromEntries(
            Object.entries(properties).map(([name, property]) => [
              name,
              property?.value,
            ])
          );
          const payload = encodeURIComponent(JSON.stringify(values));
          window.location.replace(`${hostedWallpaperUrl}#properties=${payload}`);
        };
      } else {
        const initialProperties = {};
        const browserLinkID = new URLSearchParams(window.location.search).get(
          'linkID'
        );

        if (browserLinkID) {
          initialProperties.linkID = { value: browserLinkID };
        }

        if (window.location.hash.startsWith('#properties=')) {
          try {
            const values = JSON.parse(
              decodeURIComponent(window.location.hash.slice(12))
            );
            for (const [name, value] of Object.entries(values)) {
              initialProperties[name] = { value };
            }

            // Keep transferred settings out of browser history and referrers.
            window.history.replaceState(
              null,
              '',
              `${window.location.pathname}${window.location.search}`
            );
          } catch (error) {
            console.error('Could not read Wallpaper Engine properties:', error);
          }
        }

        window.initialWallpaperProperties = initialProperties;
      }
    </script>
    <!--stylesheets-->
    <link rel="stylesheet" href="./styles/var.css" type="text/css" />
    <link rel="stylesheet" href="./styles/style.css" type="text/css" />
    <!--imports-->
    <script type="text/javascript" src="./jQuery/jquery.js"></script>
    <!--fontawesome-->
    <script defer src="./fontawesome-free-6.7.2/js/fontawesome.js"></script>
    <script defer src="./fontawesome-free-6.7.2/js/all.js"></script>
    <!--scripts-->
    <script id="apiScript" type="text/javascript" src="./js/api.js"></script>
    <script type="text/javascript" src="./js/script.js?v=3"></script>
    <style id="dynCSS"></style>
  </head>

  <body>
    <div id="rtop-left" class="area">
      <div id="top-left" class="content"></div>
    </div>
    <div id="rtop-center" class="area">
      <div id="top-center" class="content"></div>
    </div>
    <div id="rtop-right" class="area">
      <div id="top-right" class="content"></div>
    </div>
    <div id="rcenter-center" class="area">
      <div id="center-center" class="content">
        <p id="centerMessage" class="text">
          Looks like there is no Link set yet <br />
          Got to the wallpaper settings and put your link-number into the first
          box
        </p>
      </div>
    </div>
    <div id="rbottom-left" class="area">
      <div id="bottom-left" class="content"></div>
    </div>
    <div id="rbottom-center" class="area">
      <div id="bottom-center" class="content"></div>
    </div>
    <div id="rbottom-right" class="area">
      <div id="bottom-right" class="content"></div>
    </div>

    <div id="canvas">
      <img id="bImg" class="bImg" style="visibility: hidden" />
      <video id="bVid" class="bImg" style="visibility: hidden" autoplay>
        Video error
      </video>
    </div>
  </body>
</html>
